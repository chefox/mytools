<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f0f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { margin: 15px 0 25px; font-size: 2.6rem; color: #e8750a; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
  .container {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .settings {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 32px;
    border-radius: 16px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    border: 1px solid #e0e0e8;
  }
  .setting-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .setting-group label {
    font-size: 1.1rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
  .setting-group input[type="number"] {
    width: 100px;
    padding: 14px;
    border: 3px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
    color: #333;
    font-size: 1.4rem;
    font-weight: bold;
    text-align: center;
    transition: border-color 0.3s;
  }
  .setting-group input[type="number"]:focus {
    border-color: #e8750a;
    outline: none;
    box-shadow: 0 0 8px rgba(232,117,10,0.2);
  }
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .checkbox-group:hover { border-color: #e8750a; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .checkbox-group input[type="checkbox"] {
    width: 24px;
    height: 24px;
    accent-color: #e8750a;
    cursor: pointer;
  }
  .checkbox-group span {
    font-size: 1.2rem;
    font-weight: 600;
    user-select: none;
    color: #444;
  }
  .controls {
    display: flex;
    gap: 24px;
  }
  .btn {
    padding: 18px 52px;
    font-size: 1.4rem;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .btn-start {
    background: #e8750a;
    color: #fff;
  }
  .btn-start:hover { background: #f5882a; box-shadow: 0 6px 20px rgba(232,117,10,0.4); }
  .btn-stop {
    background: #4a90d9;
    color: #fff;
  }
  .btn-stop:hover { background: #5a9fe9; box-shadow: 0 6px 20px rgba(74,144,217,0.4); }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .timer-display {
    position: relative;
    width: 420px;
    height: 420px;
  }
  .timer-display svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.18));
  }
  .timer-display svg circle {
    fill: none;
    stroke-width: 10;
  }
  .bg-circle {
    stroke: #e8e8f0;
  }
  .progress-circle {
    stroke: #e8750a;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.05s linear, stroke 0.5s ease;
    filter: drop-shadow(0 0 10px rgba(232,117,10,0.5));
  }
  .timer-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .timer-text .time {
    font-size: 5rem;
    font-weight: bold;
    color: #333;
    line-height: 1;
  }
  .timer-text .phase {
    font-size: 1.6rem;
    color: #999;
    margin-top: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .side-indicator {
    font-size: 1.4rem;
    color: #e8750a;
    margin-top: 8px;
    min-height: 1.6em;
    font-weight: bold;
  }
  .total-timer {
    width: 100%;
    background: #ffffff;
    padding: 26px 32px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    border: 1px solid #e0e0e8;
  }
  .total-timer label {
    font-size: 1rem;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
  .total-timer .total-time {
    font-size: 3rem;
    font-weight: bold;
    color: #4ecca3;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
    text-shadow: 1px 1px 3px rgba(78,204,163,0.3);
  }
</style>
</head>
<body>

<h1>🏋️ Training Counter</h1>

<div class="container">
  <div class="settings">
    <div class="setting-group">
      <label>Active (min)</label>
      <input type="number" id="activeTime" value="3" min="1" step="0.5">
    </div>
    <div class="setting-group">
      <label>Pause (min)</label>
      <input type="number" id="pauseTime" value="1" min="0.5" step="0.5">
    </div>
    <div class="setting-group">
      <label>Switch (sec)</label>
      <input type="number" id="sideTime" value="5" min="1" step="1">
    </div>
    <div class="checkbox-group" id="twoSideGroup">
      <input type="checkbox" id="twoSide">
      <span>2-Side</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="btnStart">Start</button>
    <button class="btn btn-stop" id="btnStop" disabled>Stop</button>
  </div>

  <div class="timer-display">
    <svg viewBox="-15 -15 230 230" style="filter: drop-shadow(0 6px 16px rgba(0,0,0,0.18));">
      <defs>
        <filter id="glowOrange">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowGreen">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle class="bg-circle" cx="100" cy="100" r="90"></circle>
      <circle class="progress-circle" id="progressCircle" cx="100" cy="100" r="90"
        stroke-dasharray="565.48" stroke-dashoffset="565.48" transform="rotate(-90 100 100)"
        filter="url(#glowOrange)"></circle>
      <circle id="roundBg" cx="100" cy="100" r="108" fill="none" stroke-width="14" stroke-linecap="butt" transform="rotate(-90 100 100)"/>
      <circle id="roundProgress" cx="100" cy="100" r="108" fill="none" stroke-width="14" stroke-linecap="butt" stroke-dasharray="678.58" stroke-dashoffset="678.58" transform="rotate(-90 100 100)" style="transition: stroke-dashoffset 0.05s linear"/>
    </svg>
    <div class="timer-text">
      <div class="time" id="currentTime">3:00</div>
      <div class="phase" id="currentPhase">Active</div>
      <div class="side-indicator" id="sideIndicator"></div>
    </div>
  </div>

  <div class="total-timer">
    <label>Total Training Time</label>
    <div class="total-time" id="totalTime">0:00</div>
  </div>
</div>

<script>
  const CIRCUMFERENCE = 2 * Math.PI * 90;
  const progressCircle = document.getElementById('progressCircle');
  progressCircle.style.strokeDasharray = CIRCUMFERENCE;

  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const activeTimeInput = document.getElementById('activeTime');
  const pauseTimeInput = document.getElementById('pauseTime');
  const sideTimeInput = document.getElementById('sideTime');
  const twoSideCheckbox = document.getElementById('twoSide');
  const currentTimeEl = document.getElementById('currentTime');
  const currentPhaseEl = document.getElementById('currentPhase');
  const sideIndicatorEl = document.getElementById('sideIndicator');
  const totalTimeEl = document.getElementById('totalTime');
  const hitSound = new Audio('hit.mp3');

const ROUND_RADIUS = 108;
const ROUND_CIRC = 2 * Math.PI * ROUND_RADIUS;
const roundBg = document.getElementById('roundBg');
const roundProgress = document.getElementById('roundProgress');
const ROUND_COLORS = {
  active: 'rgba(232,117,10,0.5)',
  switch: 'rgba(78,204,163,0.5)',
  pause: 'rgba(78,204,163,0.5)'
};
const ROUND_BASE_COLOR = 'rgba(200,200,200,0.08)';

let roundActiveDuration = 0;
let roundSideDuration = 0;
let roundPauseDuration = 0;
let roundTwoSide = false;
let roundTotalDuration = 0;
let roundElapsed = 0;

function getRoundPhaseColor(state) {
  if (state === 'active' || state === 'firstSide' || state === 'secondSide') return ROUND_COLORS.active;
  if (state === 'switch') return ROUND_COLORS.switch;
  if (state === 'pause') return ROUND_COLORS.pause;
  return ROUND_COLORS.active;
}

function updateRoundSectors() {
  const total = roundTwoSide
    ? roundActiveDuration * 60 + roundSideDuration + roundActiveDuration * 60 + roundPauseDuration * 60
    : roundActiveDuration * 60 + roundPauseDuration * 60;
  const gap = 2;
  const phases = roundTwoSide
    ? [roundActiveDuration * 60, roundSideDuration, roundActiveDuration * 60, roundPauseDuration * 60]
    : [roundActiveDuration * 60, roundPauseDuration * 60];

  const availableLen = ROUND_CIRC - gap * phases.length;
  let dasharray = '';
  for (const p of phases) {
    const segLen = Math.round((p / total) * availableLen);
    dasharray += segLen + ' ' + gap + ' ';
  }
  roundBg.setAttribute('stroke-dasharray', dasharray.trim());
  roundBg.setAttribute('stroke', ROUND_BASE_COLOR);
}

function updateRoundProgress(state) {
  const fraction = roundElapsed / roundTotalDuration;
  roundProgress.setAttribute('stroke-dashoffset', ROUND_CIRC * (1 - Math.min(Math.max(fraction, 0), 1)));
  roundProgress.setAttribute('stroke', getRoundPhaseColor(state));
}

function resetRound() {
  roundProgress.setAttribute('stroke-dashoffset', ROUND_CIRC);
  roundBg.setAttribute('stroke', ROUND_BASE_COLOR);
  roundBg.setAttribute('stroke-dasharray', '');
}

let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
      });
    }
  } catch (err) {
    console.warn('Wake Lock not available:', err);
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    await wakeLock.release();
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wakeLock === null && running) {
    requestWakeLock();
  }
});
  let running = false;
  let totalSeconds = 0;
  let currentPhaseSeconds = 0;
  let currentPhaseDuration = 0;
  let activeDuration = 0;
  let pauseDuration = 0;
  let sideDuration = 5;
  let twoSide = false;
  let state = 'idle';
  let phaseElapsed = 0;

  const COLORS = {
    active: '#e8750a',
    pause: '#4ecca3',
    side: '#4ecca3'
  };

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function bellSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.8);
  }

  function setPhaseColors(phase) {
    const color = phase === 'pause' ? COLORS.pause : phase === 'side' ? COLORS.side : COLORS.active;
    progressCircle.style.stroke = color;
    progressCircle.style.filter = 'url(#glow' + (phase === 'pause' ? 'Green' : phase === 'side' ? 'Green' : 'Orange') + ')';
    currentPhaseEl.style.color = color;
    sideIndicatorEl.style.color = color;
  }

  function updateProgress(fraction) {
    const offset = CIRCUMFERENCE * (1 - Math.min(Math.max(fraction, 0), 1));
    progressCircle.style.strokeDashoffset = offset;
  }

  function updateTextDisplay() {
    currentTimeEl.textContent = formatTime(Math.max(0, Math.round(currentPhaseSeconds)));
    totalTimeEl.textContent = formatTime(Math.max(0, Math.round(totalSeconds)));
  }

  function updateDisplay() {
    updateTextDisplay();
    const phaseMs = (state === 'switch') ? sideDuration * 1000 : currentPhaseDuration * 60000;
    const elapsedFraction = phaseMs > 0 ? phaseElapsed / phaseMs : 0;
    updateProgress(Math.min(Math.max(elapsedFraction, 0), 1));
  }

  function transitionTo(nextState) {
    state = nextState;
    phaseElapsed = 0;
    if (state === 'firstSide') roundElapsed = 0;

    if (!twoSide) {
      if (state === 'pause') {
        currentPhaseDuration = pauseDuration;
        currentPhaseSeconds = pauseDuration * 60;
        currentPhaseEl.textContent = 'Pause';
        sideIndicatorEl.textContent = '';
        setPhaseColors('pause');
      } else {
        currentPhaseDuration = activeDuration;
        currentPhaseSeconds = activeDuration * 60;
        currentPhaseEl.textContent = 'Active';
        sideIndicatorEl.textContent = '';
        setPhaseColors('active');
      }
    } else {
      if (state === 'firstSide') {
        currentPhaseDuration = activeDuration;
        currentPhaseSeconds = activeDuration * 60;
        currentPhaseEl.textContent = 'First Side';
        sideIndicatorEl.textContent = '⚔ First Side';
        setPhaseColors('active');
      } else if (state === 'switch') {
        currentPhaseDuration = sideDuration;
        currentPhaseSeconds = sideDuration;
        currentPhaseEl.textContent = 'Switch';
        sideIndicatorEl.textContent = '🔄 Switch';
        setPhaseColors('side');
      } else if (state === 'secondSide') {
        currentPhaseDuration = activeDuration;
        currentPhaseSeconds = activeDuration * 60;
        currentPhaseEl.textContent = 'Second Side';
        sideIndicatorEl.textContent = '⚔ Second Side';
        setPhaseColors('active');
        bellSound();
      } else if (state === 'pause') {
        currentPhaseDuration = pauseDuration;
        currentPhaseSeconds = pauseDuration * 60;
        currentPhaseEl.textContent = 'Pause';
        sideIndicatorEl.textContent = '';
        setPhaseColors('pause');
      }
    }

    progressCircle.style.strokeDashoffset = CIRCUMFERENCE;
    updateTextDisplay();
    hitSound.currentTime = 0;
    hitSound.play().catch(() => {});
  }

  function tick() {
    if (!running) return;

    phaseElapsed += 50;
    const phaseMs = (state === 'switch') ? sideDuration * 1000 : currentPhaseDuration * 60000;
    currentPhaseSeconds = Math.max(0, phaseMs / 1000 - phaseElapsed / 1000);
    roundElapsed += 0.05;
    updateDisplay();
    updateRoundProgress(state);

    if (currentPhaseSeconds <= 0) {
      if (!twoSide) {
        state = state === 'pause' ? 'active' : 'pause';
      } else {
        if (state === 'firstSide') state = 'switch';
        else if (state === 'switch') state = 'secondSide';
        else if (state === 'secondSide') state = 'pause';
        else if (state === 'pause') state = 'firstSide';
      }
      transitionTo(state);
    }
  }

  function startTimer() {
    if (running) return;

    activeDuration = parseFloat(activeTimeInput.value) || 3;
    pauseDuration = parseFloat(pauseTimeInput.value) || 1;
    sideDuration = parseFloat(sideTimeInput.value) || 5;
    twoSide = twoSideCheckbox.checked;

    if (activeDuration <= 0 || pauseDuration <= 0) {
      alert('Please enter valid positive durations.');
      return;
    }

    running = true;
    totalSeconds = 0;
    phaseElapsed = 0;

    btnStart.disabled = true;
    btnStop.disabled = false;
    activeTimeInput.disabled = true;
    pauseTimeInput.disabled = true;
    twoSideCheckbox.disabled = true;

    state = twoSide ? 'firstSide' : 'active';
    transitionTo(state);

    roundActiveDuration = activeDuration;
    roundSideDuration = sideDuration;
    roundPauseDuration = pauseDuration;
    roundTwoSide = twoSide;
    roundTotalDuration = twoSide
      ? activeDuration * 60 + sideDuration + activeDuration * 60 + pauseDuration * 60
      : activeDuration * 60 + pauseDuration * 60;
    roundElapsed = 0;
    resetRound();
    updateRoundSectors();

    timerInterval = setInterval(tick, 50);
    requestWakeLock();
  }

  function stopTimer() {
    running = false;
    clearInterval(timerInterval);
    timerInterval = null;
    resetRound();

    btnStart.disabled = false;
    btnStop.disabled = true;
    activeTimeInput.disabled = false;
    pauseTimeInput.disabled = false;
    twoSideCheckbox.disabled = false;

    currentPhaseEl.style.color = '#999';
    sideIndicatorEl.textContent = '';
    sideIndicatorEl.style.color = '#e8750a';
    progressCircle.style.stroke = '#e8e8f0';
    progressCircle.style.filter = 'none';
    releaseWakeLock();
  }

  btnStart.addEventListener('click', startTimer);
  btnStop.addEventListener('click', stopTimer);
</script>

</body>
</html>
